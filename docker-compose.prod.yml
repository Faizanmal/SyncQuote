# SyncQuote — VPS production stack (faizanmalik.me)
# Usage:
#   cp .env.production.example .env.production
#   # edit secrets, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

name: syncquote

services:
  caddy:
    image: caddy:2-alpine
    container_name: syncquote-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-syncquote.faizanmalik.me}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - syncquote

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://syncquote.faizanmalik.me/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-https://syncquote.faizanmalik.me}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://syncquote.faizanmalik.me}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STRIPE_PRO_PRICE_ID: ${NEXT_PUBLIC_STRIPE_PRO_PRICE_ID:-}
        NEXT_PUBLIC_STRIPE_ENTERPRISE_PRICE_ID: ${NEXT_PUBLIC_STRIPE_ENTERPRISE_PRICE_ID:-}
    container_name: syncquote-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - syncquote
    expose:
      - "3000"

  backend:
    build:
      context: ./backend-nestjs
      dockerfile: Dockerfile
    container_name: syncquote-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api
      # Must point at the compose service name "postgres" (not localhost).
      # Set in .env.production — URL-encode special chars in the password.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FRONTEND_URL: ${FRONTEND_URL:-https://syncquote.faizanmalik.me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://syncquote.faizanmalik.me}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api/v1/health/ping',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    networks:
      - syncquote
    expose:
      - "3001"

  postgres:
    image: postgres:16-alpine
    container_name: syncquote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syncquote}
      POSTGRES_USER: ${POSTGRES_USER:-syncquote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - syncquote
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncquote} -d ${POSTGRES_DB:-syncquote}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host — only reachable inside the Docker network

  redis:
    image: redis:7-alpine
    container_name: syncquote-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - syncquote
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  syncquote:
    driver: bridge
